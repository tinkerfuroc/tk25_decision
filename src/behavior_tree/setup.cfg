[develop]
script_dir=$base/lib/behavior_tree
[install]
install_scripts=$base/lib/behavior_tree

[tool:pytest]
markers =
    copyright: ament copyright check
    flake8: ament flake8 check
    linter: static-analysis check
    pep257: ament docstring check
    live_openrouter: opt-in multimodal OpenRouter tests
